lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      '@design-system/foundation':
        specifier: ^2.0.0
        version: 2.5.3
      es-toolkit:
        specifier: ^1.39.0
        version: 1.39.10
      lodash:
        specifier: ^4.17.21
        version: 4.17.21
      react:
        specifier: ^18.3.0
        version: 18.3.1
      react-dom:
        specifier: ^18.3.0
        version: 18.3.1
    devDependencies:
      moment:
        specifier: ^2.29.4
        version: 2.29.4

packages:

  '@design-system/foundation@2.5.3':
    resolution: {integrity: sha512-mock}

  # Imported as functions and never rendered, so `usageCount` reads 0 for
  # both while `importingFileCount` reads 3 and 1 — the function-only versus
  # pair of #174, and the only packages here that exercise it.
  lodash@4.17.21:
    resolution: {integrity: sha512-mock}

  es-toolkit@1.39.10:
    resolution: {integrity: sha512-mock}

  react@18.3.1:
    resolution: {integrity: sha512-mock}
    engines: {node: '>=0.10.0'}

  react-dom@18.3.1:
    resolution: {integrity: sha512-mock}
    peerDependencies:
      react: ^18.3.1

  # Declared in package.json (devDependencies) and installed, but never
  # imported by any fixture source file — the #75 case: invisible to import
  # analysis, still forbidden by fixtures/hermex.config.ts.
  moment@2.29.4:
    resolution: {integrity: sha512-mock}

  # Present only under `packages` and never in `importers`, i.e. pulled in by
  # another dependency. Purely transitive: nothing this repo declares, so
  # no-packages must not flag it.
  js-tokens@4.0.0:
    resolution: {integrity: sha512-mock}
