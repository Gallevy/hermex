# .github/workflows/pull-request.yml
name: PR

on:
  pull_request:
    branches: ['main', 'beta']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm CLI
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run format
        run: pnpm run format:ci

      - name: Run lint
        run: pnpm run lint:ci

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test:ci

      - name: Build project
        run: pnpm run build:ci

  coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: main
            artifact: main
          - branch: ${{ github.head_ref }}
            artifact: pull-request
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: Setup pnpm CLI
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        # --if-present: the main branch won't have this script until this
        # workflow's own PR merges — skip cleanly instead of failing when
        # comparing against a main checkout that predates it.
        run: pnpm run --if-present test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.artifact }}
          path: coverage
          if-no-files-found: ignore

  report-coverage:
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download PR coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-pull-request
          path: coverage

      - name: Download main coverage
        # No artifact exists yet the first time this runs (main predates the
        # coverage tooling) — don't fail the job over a baseline that
        # doesn't exist yet.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-main
          path: coverage-main

      - name: Report coverage (vs main)
        if: hashFiles('coverage-main/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-compare-path: coverage-main/coverage-summary.json

      - name: Report coverage (no main baseline yet)
        if: hashFiles('coverage-main/coverage-summary.json') == ''
        uses: davelosert/vitest-coverage-report-action@v2
