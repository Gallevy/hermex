# .github/workflows/output-review.yaml
#
# Puts hermex's real output in front of a human on every PR. Runs the case
# matrix in fixtures/cases.ts twice — once against this checkout, once
# against a fresh build of the target branch (`scripts/output-review.ts`
# manages that second build itself, via a git worktree) — and diffs what
# the two actually printed. Nothing is committed for this to work against:
# both sides are always real output of real code, so there is no baseline
# file to refresh, forget to refresh, or hand-edit. Reported twice,
# deliberately differently:
#
#   - The sticky PR comment carries one row per **changed** case — name,
#     +N -M, and a single link. No diffs: a renderer tweak moves every row
#     of sixteen cases at once, which is 60 KB against GitHub's
#     65,536-character comment limit.
#   - A page per case, published to gh-pages when OUTPUT_REVIEW_SITE is set
#     and uploaded as an artifact regardless, carrying that case's context,
#     the config it ran under, its full diff and its complete output. Two
#     cases cannot be confused if they were never on the same page. The
#     pages are Markdown rendered by Pages' Jekyll build, so there is no
#     stylesheet here to maintain.
#   - The job summary, as the fallback destination when nothing is
#     published, and the whole matrix in one scrollable place.
#
# A comment listing two dozen `unchanged` rows is what the first version
# did, and a wall is what people stop reading.
#
# This is a required check, but an output diff alone never fails it — a
# changed output isn't necessarily a bug, and whether it's an *approved*
# change is a separate, human question handled by
# `.github/workflows/output-approval.yaml`. What does fail this one is a
# genuine defect: an exit code that doesn't match what a case asserts, or a
# broken invariant (ANSI leaking onto stdout, JSON with chrome mixed in,
# …) — see the blocking-invariants section of `scripts/output-review.ts`.
name: Output review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: ['main', 'beta']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is for the gh-pages branch the case pages are
      # published to, and nothing else. It is only exercised when the
      # OUTPUT_REVIEW_SITE variable is set.
      contents: write
      pull-requests: write
    outputs:
      # Whether any case's output differs from `--against` — read by
      # output-approval below. Re-derived on every run of this job,
      # including a bare label toggle, rather than cached anywhere: nothing
      # here is trusted from a previous run, matching how the comparison
      # itself never trusts anything but freshly executed code.
      changed: ${{ steps.matrix.outputs.changed }}
    steps:
      # Full history, not the default shallow clone: scripts/output-review.ts
      # resolves and builds `--against` (the target branch, GITHUB_BASE_REF
      # on a pull_request event) itself via `git rev-parse`/`git fetch` and
      # a worktree — a shallow checkout would make the first resolve attempt
      # fail every time, falling back to a fetch that then has to do the
      # same work anyway.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm CLI
        uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # scripts/output-review.ts builds `--against` itself (git worktree,
      # install, build) into .output-review/reference/<sha>/ and reuses that
      # path if it already exists — this just gives it something to find
      # already there. Keyed on the target branch's exact commit, so it hits
      # on every PR run until that branch moves, and misses (falling back to
      # the script doing the real build once, which the post-job save step
      # then caches) the first run after it does.
      - name: Cache the target branch's reference build
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: .output-review/reference/${{ github.event.pull_request.base.sha }}
          key: output-review-reference-${{ github.event.pull_request.base.sha }}

      # OUTPUT_REVIEW_SITE is the Pages base URL, e.g.
      # https://gallevy.github.io/hermex/output-review. Setting it is what
      # switches the per-case pages on: the comment then links a page per
      # case, and the publish step below runs. Leave it unset and the pages
      # are still generated and uploaded as an artifact, but the comment
      # falls back to linking the job summary. Hosting is therefore a
      # repository setting, not a code change.
      - name: Run the output matrix
        id: matrix
        env:
          OUTPUT_REVIEW_SITE_URL: >-
            ${{ vars.OUTPUT_REVIEW_SITE != '' && github.event_name == 'pull_request'
            && format('{0}/pr-{1}', vars.OUTPUT_REVIEW_SITE, github.event.pull_request.number)
            || '' }}
        # `set +e`: this step's own exit code still has to reflect a real
        # failure (an exit-code mismatch or a blocking invariant — never an
        # output diff on its own, see the module doc comment), but the
        # `changed` output has to be captured either way for the
        # output-approval job below to read.
        run: |
          set +e
          pnpm run test:output
          status=$?
          echo "changed=$(cat .output-review/changed 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"
          exit $status

      # Uploaded whether or not Pages is configured — it is the fallback way
      # to read a case page, and it costs nothing when nobody downloads it.
      - name: Upload the case pages
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: output-review-site
          path: .output-review/site
          if-no-files-found: ignore
          retention-days: 14

      # One directory per PR, overwritten on each run rather than one per
      # run: a reviewer wants the current state of this PR, and a directory
      # per run would grow the branch without bound.
      #
      # TARGET has to be the path *under the Pages root* that
      # OUTPUT_REVIEW_SITE resolves to, or every link in the comment 404s.
      # With OUTPUT_REVIEW_SITE = https://<user>.github.io/hermex/output-review
      # and Pages serving gh-pages at /, that path is output-review/pr-<n>.
      # The `output-review/` prefix keeps the rest of the branch free for
      # anything else the project may want to publish later.
      - name: Publish the case pages
        if: always() && vars.OUTPUT_REVIEW_SITE != '' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: output-review/pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          workspace="$PWD"
          site="$workspace/.output-review/site"
          if [ ! -d "$site" ]; then
            echo "No site was generated; nothing to publish."
            exit 0
          fi

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          pages="$(mktemp -d)"
          if git clone --depth 1 --branch gh-pages "$remote" "$pages" 2>/dev/null; then
            echo "Updating the existing gh-pages branch."
          else
            echo "Creating gh-pages."
            git clone --depth 1 "$remote" "$pages"
            git -C "$pages" checkout --orphan gh-pages
            git -C "$pages" rm -rq --cached . || true
            find "$pages" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

          # The pages are Markdown, so Jekyll is what renders them — the
          # opposite of the usual `.nojekyll` reflex. Its config has to sit
          # at the branch root, since that is the root of what Jekyll builds.
          rm -f "$pages/.nojekyll"
          cp "$workspace/.output-review/jekyll-config.yml" "$pages/_config.yml"
          mkdir -p "$pages/assets/css"
          cp "$workspace/.output-review/jekyll-style.scss" "$pages/assets/css/style.scss"
          rm -rf "${pages:?}/$TARGET"
          mkdir -p "$pages/$TARGET"
          cp -R "$site/." "$pages/$TARGET/"

          cd "$pages"

          # A landing page at the site root. The theme's header title links
          # there, so without it every case page has a 404 in its corner.
          # Rebuilt from what is actually on the branch rather than appended
          # to, so a removed directory does not leave a dead row behind.
          shopt -s nullglob
          {
            echo '---'
            echo 'layout: default'
            echo 'title: "Hermex Output Review"'
            echo '---'
            echo
            echo '# Hermex Output Review'
            echo
            echo 'What the hermex CLI actually printed, one page per case, published per pull request by `.github/workflows/output-review.yaml`.'
            echo
            for dir in output-review/pr-*/; do
              number="${dir#output-review/pr-}"
              number="${number%/}"
              echo "- [Pull request #${number}](./output-review/pr-${number}/index.html)"
            done
          } > index.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --quiet --cached; then
            echo "The published pages are already current."
          else
            git commit -m "output review: $TARGET"
            git push origin gh-pages
          fi

      # `always()`: the comment is most useful precisely when the run failed
      # — it is what tells the reviewer which cases changed and where to
      # read them.
      - name: Post the review comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = '.output-review/comment.md';
            if (!fs.existsSync(path)) {
              core.warning('No output-review report was produced.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- hermex-output-review -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            // Updated in place rather than appended: one PR gets one output
            // review, and a thread of stale matrices is worse than none.
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # The second required check: `review` only proves an output diff is
  # *true* — the label gate is what proves a human looked at it. A reviewer
  # can approve a PR on the code alone without ever opening the
  # output-review comment; applying `output:approved` is a distinct,
  # deliberate act instead. See CONTRIBUTING.md for the reviewer-facing
  # version of this.
  #
  # No checkout here at all — everything this needs comes from the `gh` CLI
  # against the PR directly, and `needs.review.outputs.changed` for whether
  # the label even applies.
  output-approval:
    needs: review
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # Unconditional, the same way GitHub's own "dismiss stale reviews on
      # push" is unconditional — there's no committed file left to check
      # "did this push actually touch the output", so a label surviving an
      # unrelated push is the safer failure mode to avoid, not a stale
      # review covering a diff nobody re-read.
      - name: Remove output:approved on a new push
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr edit "${{ github.event.pull_request.number }}"
          --repo "${{ github.repository }}"
          --remove-label output:approved || true

      - name: Require the output:approved label when output changed
        if: needs.review.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          labels="$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json labels -q '.labels[].name')"
          if ! grep -qxF 'output:approved' <<< "$labels"; then
            echo "::error::Output changed vs the target branch in this PR. Read the output-review diff, then apply the output:approved label."
            exit 1
          fi
          echo "output:approved present — satisfied."

      - name: Nothing to approve
        if: needs.review.outputs.changed == 'false'
        run: echo "Output matches the target branch — no approval needed."
