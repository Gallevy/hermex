# .github/workflows/output-approval.yaml
#
# output-review.yaml's `review` check only proves a baseline is *true* — it
# re-runs the CLI and the committed file has to match exactly, so a stale or
# hand-typed baseline can't pass either way (see CONTRIBUTING.md). It says
# nothing about whether anyone actually looked at what changed, and merging
# a PR doesn't require that either — you can approve a PR on the code alone
# without ever opening the output-review comment.
#
# This is that second, narrower gate: when a PR's tests/__output_baselines__/
# differs from the target branch, merging requires the `output:approved`
# label. No output change, no label needed — the check passes on its own.
#
# A later push that touches the baselines again removes the label, so an
# old approval can't silently cover a different diff than the one it was
# given for — the point is "did someone look at *this* diff," not "was this
# label ever applied at some point in this PR's history."
name: Output approval

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: ['main', 'beta']

permissions:
  contents: read
  pull-requests: write

jobs:
  output-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `before` is the zero SHA on a PR's first synchronize from a
      # force-push history GitHub can't diff — nothing to compare, skip.
      - name: Remove output:approved if this push touched the baselines
        if: >-
          github.event.action == 'synchronize' &&
          github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BEFORE" "$AFTER" -- tests/__output_baselines__; then
            echo "This push didn't touch tests/__output_baselines__/; leaving the label alone."
          else
            echo "This push changed tests/__output_baselines__/; removing output:approved so it's re-reviewed."
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label output:approved || true
          fi

      - name: Check whether output baselines changed vs the target branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          if git diff --quiet "$MERGE_BASE" "$HEAD" -- tests/__output_baselines__; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: baseline

      - name: Require the output:approved label
        if: >-
          steps.baseline.outputs.changed == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'output:approved')
        run: |
          echo "::error::tests/__output_baselines__/ changed in this PR. Read the output-review diff, then apply the output:approved label."
          exit 1

      - name: Nothing to approve
        if: steps.baseline.outputs.changed == 'false'
        run: echo "tests/__output_baselines__/ is unchanged in this PR — no approval needed."
