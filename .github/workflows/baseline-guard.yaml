# .github/workflows/baseline-guard.yaml
#
# Blocks a PR if a human commit touches tests/__output_baselines__/**
# directly. The only legitimate way that directory changes is the bot
# commit pushed by baseline-approve.yaml, after a reviewer applies the
# `baseline:approved` label — see that workflow's header for the full flow.
#
# This is what makes output-review.yaml's diff trustworthy: without this
# guard, a PR could make its own output-review check pass by editing its
# baseline copy to match whatever the code now prints, with nobody having
# reviewed that the new output is actually correct. With it, the only path
# to a matching baseline is: a reviewer saw the diff, applied the label,
# and the bot regenerated it from the PR's own code.
name: Baseline authorship guard

on:
  pull_request:
    branches: ['main', 'beta']

permissions:
  contents: read

jobs:
  baseline-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify baseline commits are bot-authored
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BOT_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'

          offenders=""
          while IFS= read -r commit; do
            [ -z "$commit" ] && continue
            author="$(git log -1 --format=%ae "$commit")"
            if [ "$author" != "$BOT_EMAIL" ]; then
              offenders="${offenders}${commit} (${author})"$'\n'
            fi
          done < <(git log --format=%H "${BASE}..${HEAD}" -- tests/__output_baselines__)

          if [ -n "$offenders" ]; then
            echo "The following commits touch tests/__output_baselines__/ but were not authored by the approval bot:"
            printf '%s' "$offenders"
            echo
            echo "Baselines only change via the baseline:approved label — see .github/workflows/baseline-approve.yaml. Revert your changes to tests/__output_baselines__/, let output-review.yaml show the diff, then ask a reviewer to apply the label."
            exit 1
          fi

          echo "No human commits touch tests/__output_baselines__/ — clean."
