# TEMPORARY — delete before merging.
#
# Proves the release App wiring works before it is trusted on main:
#   - vars.RELEASE_APP_CLIENT_ID is correct
#   - secrets.RELEASE_APP_PRIVATE_KEY is a valid key for that App
#   - the App is actually installed on this repository
#
# The token is masked by create-github-app-token; nothing secret is printed.
name: TEMP verify app token

on:
  pull_request:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Prove the installation can reach this repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Repos visible to the installation:"
          gh api installation/repositories --jq '.repositories[].full_name'
          echo "---"
          echo "Granted permissions on this token:"
          gh api installation/repositories --jq '.repositories[0].permissions'
